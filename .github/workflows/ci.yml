name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      # Integration tests need a Neon TEST branch (never the main dev data). Add these repository secrets.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      MFA_ENC_KEY: Y2ktb25seS10ZXN0LWtleS0zMi1ieXRlcy1sb25nISE= # throwaway key for the disposable test branch (the TEST_MFA_ENC_KEY secret was not a valid 32-byte base64 value)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moz/db generate
      - run: pnpm --filter @moz/db migrate
      # The integration tests assert on the demo fixtures, so seed the (disposable) test branch first.
      - run: pnpm --filter @moz/seed seed:demo:test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SEED_DEMO_PASSWORD: ci-only-Demo-Passw0rd!
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @moz/web exec playwright install --with-deps chromium
      - run: pnpm --filter @moz/web exec playwright test
